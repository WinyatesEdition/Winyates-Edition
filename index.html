<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winyates Edition</title>
<style>
    :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-sub: #64748b;
        --border: #e2e8f0;
        --header-bg: rgba(255, 255, 255, 0.88);
        --accent-orange: #f59e0b;
        --accent-purple: #7c3aed;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --shadow-hover: 0 20px 25px -5px rgba(124, 58, 237, 0.2);
        --btn-bg: #f1f5f9;
        --school-blue: #2563eb;
        --owner-gold: #d97706;
    }

    [data-theme="dark"] {
        --bg: #09090b;
        --card-bg: #141419;
        --text: #f8fafc;
        --text-sub: #94a3b8;
        --border: #27272a;
        --header-bg: rgba(20, 20, 25, 0.88);
        --accent-orange: #fbbf24;
        --accent-purple: #a78bfa;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 20px 25px -5px rgba(167, 139, 250, 0.25);
        --btn-bg: #27272a;
        --school-blue: #3b82f6;
        --owner-gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-y: scroll; }

    header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--header-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow);
    }

    .brand-container { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .logo-wrapper { background: rgba(124, 58, 237, 0.05); border: 1px solid var(--border); padding: 4px 8px; border-radius: 12px; display: flex; align-items: center; transition: transform 0.2s; }
    .logo-wrapper:hover { transform: rotate(-3deg) scale(1.05); }
    .logo-img { height: 38px; width: auto; }
    .brand-title { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .header-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    
    .search-container input { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 30px; outline: none; width: 180px; font-size: 0.85rem; transition: all 0.2s; }
    .search-container input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); width: 220px; }

    .nav-btn {
        background: var(--btn-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 0.5rem 0.9rem;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .nav-btn:hover { transform: translateY(-2px); border-color: var(--accent-purple); }

    .dropdown { position: relative; display: inline-block; }
    .school-btn {
        background: linear-gradient(135deg, var(--school-blue), #1d4ed8);
        color: #ffffff;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .school-btn:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.1); }
    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 110%;
        background-color: var(--card-bg);
        min-width: 190px;
        box-shadow: var(--shadow-hover);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        z-index: 200;
    }
    .dropdown-content a {
        color: var(--text);
        padding: 10px 14px;
        text-decoration: none;
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
    }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover { background-color: var(--btn-bg); color: var(--accent-purple); padding-left: 18px; }
    .dropdown:hover .dropdown-content { display: block; }

    .owner-pill {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        background: rgba(217, 119, 6, 0.15);
        border: 1px solid var(--owner-gold);
        color: var(--owner-gold);
        border-radius: 30px;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
    }

    .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }
    
    .shelf-section { margin-bottom: 1.5rem; display: none; }
    .shelf-title { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sub); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 6px; }
    .horizontal-scroll { display: flex; gap: 0.8rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: thin; }
    .shelf-card { min-width: 150px; background: var(--card-bg); border: 1px solid var(--border); padding: 0.8rem; border-radius: 12px; cursor: pointer; text-align: center; flex-shrink: 0; }
    .shelf-card:hover { border-color: var(--accent-purple); transform: translateY(-3px); }
    .shelf-card-title { font-size: 0.8rem; font-weight: 700; }

    .game-count { margin-bottom: 1rem; color: var(--text-sub); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.1rem; }

    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.1rem 0.9rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 95px;
        position: relative;
        overflow: hidden;
    }
    .card::before { 
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; 
        background: linear-gradient(90deg, var(--accent-purple), var(--accent-orange)); 
        opacity: 0; transition: opacity 0.25s ease; 
    }
    .card:hover { transform: translateY(-5px) scale(1.02); border-color: var(--accent-purple); box-shadow: var(--shadow-hover); }
    .card:hover::before { opacity: 1; }
    .card-title { font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .fav-star { position: absolute; top: 8px; right: 8px; font-size: 0.85rem; color: var(--border); cursor: pointer; transition: transform 0.2s; }
    .fav-star.active { color: var(--accent-orange); }
    .fav-star:hover { transform: scale(1.3); }

    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px); flex-direction: column; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding: 0.6rem 1.2rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .modal-controls { display: flex; gap: 0.5rem; }
    .control-btn { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .control-btn:hover { transform: translateY(-2px); }
    .close-btn { background: #ef4444; color: #fff; border: none; }

    .iframe-wrapper { flex: 1; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #000; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }

    .dialog-overlay { display: none; position: fixed; inset: 0; z-index: 1100; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
    .dialog-overlay.active { display: flex; }
    .dialog-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 1.5rem; box-shadow: var(--shadow-hover); position: relative; }
    .dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .dialog-title { font-size: 1.2rem; font-weight: 800; }
    .dialog-close { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-sub); text-transform: uppercase; }
    .form-control { width: 100%; background: var(--btn-bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .form-control:focus { border-color: var(--accent-purple); }
    .btn-primary { width: 100%; background: linear-gradient(135deg, var(--accent-purple), #6d28d9); color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; margin-top: 0.5rem; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
</style>
</head>
<body>

<header>
    <div class="brand-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="logo-wrapper">
            <svg class="logo-img" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <path d="M 30,30 Q 170,-10 160,70 Q 150,110 50,100" fill="none" stroke="#7e22ce" stroke-width="22" stroke-linecap="round"/>
                <path d="M 45,90 Q 160,70 140,120 Q 120,150 60,135" fill="none" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
                <path d="M 60,125 Q 150,115 130,150 Q 110,170 70,160" fill="none" stroke="#15803d" stroke-width="14" stroke-linecap="round"/>
                <path d="M 70,150 Q 130,145 115,168" fill="none" stroke="#eab308" stroke-width="10" stroke-linecap="round"/>
                <path d="M 85,165 Q 120,163 105,178" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
                <path d="M 92,175 Q 110,174 100,183" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
                <text x="62" y="112" font-family="Arial Black, sans-serif" font-weight="900" font-size="120" fill="#f59e0b" stroke="#000" stroke-width="3">W</text>
            </svg>
        </div>
        <div class="brand-title">Winyates Edition</div>
    </div>

    <div class="header-actions">
        <div id="ownerBadge" class="owner-pill">👑 Owner</div>
        <button class="nav-btn" id="addGameBtn" style="display:none;" onclick="openAddGameModal()">➕ Add Game</button>

        <div class="dropdown">
            <button class="school-btn">🏫 School Apps ▾</button>
            <div class="dropdown-content">
                <a href="https://www.edshed.com" target="_blank">🐝 Launch EdShed</a>
                <a href="https://play.ttrockstars.com" target="_blank">🎸 Launch TTRS</a>
                <a href="https://www.myon.co.uk" target="_blank">📚 Launch myON</a>
                <a href="https://student.classdojo.com/#/dojoIslands" target="_blank">🏝️ Launch Dojo Islands</a>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()">
        </div>

        <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
    </div>
</header>

<main class="container">
    <section class="shelf-section" id="favSection">
        <div class="shelf-title">⭐ Favorite Games</div>
        <div class="horizontal-scroll" id="favGrid"></div>
    </section>

    <div class="game-count" id="gameCount">Loading games...</div>
    <div id="gameGrid" class="grid"></div>
</main>

<div id="gameModal" class="modal">
    <div class="modal-bar">
        <div id="modalTitle" class="modal-title">Game View</div>
        <div class="modal-controls">
            <button class="control-btn" onclick="toggleFullscreen()">Fullscreen ⛶</button>
            <button class="control-btn close-btn" onclick="closeGame()">Close ✕</button>
        </div>
    </div>
    <div class="iframe-wrapper">
        <iframe id="gameFrame" allow="autoplay; gamepad; fullscreen; focus-without-user-activation"></iframe>
    </div>
</div>

<div id="addGameModal" class="dialog-overlay">
    <div class="dialog-card">
        <div class="dialog-header">
            <div class="dialog-title">➕ Add Custom Game</div>
            <button class="dialog-close" onclick="closeDialog('addGameModal')">✕</button>
        </div>
        <form onsubmit="handleAddGameSubmit(event)">
            <div class="form-group">
                <label>Game Title</label>
                <input type="text" id="newGameTitle" class="form-control" required placeholder="e.g. My Cool Game">
            </div>
            <div class="form-group">
                <label>Game URL or Relative Path</label>
                <input type="text" id="newGameUrl" class="form-control" required placeholder="https://... or ./games/mygame/">
            </div>
            <button type="submit" class="btn-primary">Add to Platform</button>
        </form>
    </div>
</div>

<script>
function safeGetItem(key, defaultValue) {
    try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultValue;
    } catch (e) {
        console.warn("LocalStorage access restricted:", e);
        return defaultValue;
    }
}

function safeSetItem(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
        console.warn("LocalStorage access restricted:", e);
    }
}

let isOwnerMode = safeGetItem('winyates_owner_mode', false);
let userFavorites = safeGetItem('winyates_favs', []);
let customGames = safeGetItem('winyates_custom_games', []);

const DEFAULT_GAMES = [
    { name: "1v1.lol", dir: "1v1lol" },
    { name: "2048", dir: "2048" },
    { name: "A Dark Room", dir: "adarkroom" },
    { name: "Asteroids", dir: "asteroids" },
    { name: "Baldi's Basics", dir: "baldisbasics" },
    { name: "Basketball Stars", dir: "basketballstars" },
    { name: "Basket Random", dir: "basketrandom" },
    { name: "BitLife", dir: "bitlife" },
    { name: "Block Blast", file: "blockblast.html" },
    { name: "Blumgi Ball", file: "blumgi-ball.html" },
    { name: "Boxing Random", dir: "boxingrandom" },
    { name: "Bloons TD 4", dir: "btd4" },
    { name: "Chess", dir: "chess" },
    { name: "Chrome Dino", dir: "chromedino" },
    { name: "Cluster Rush", dir: "clusterrush" },
    { name: "Cookie Clicker", dir: "cookieclicker" },
    { name: "Crossy Road", dir: "crossyroad" },
    { name: "Cut the Rope", dir: "cuttherope" },
    { name: "Doodle Jump", dir: "doodlejump" },
    { name: "DOOM", dir: "doom" },
    { name: "Drift Hunters", dir: "drifthunters" },
    { name: "Drive Mad", dir: "drivemad" },
    { name: "Duck Life", dir: "ducklife" },
    { name: "Eggy Car", dir: "eggycar" },
    { name: "Fireboy & Watergirl", dir: "fireboyandwatergirlforesttemple" },
    { name: "Flappy Bird", dir: "flappybird" },
    { name: "Friday Night Funkin'", dir: "fridaynightfunkin" },
    { name: "Fruit Ninja", dir: "fruitninja" },
    { name: "Geometry Dash", dir: "geometrydash" },
    { name: "Google Snake", dir: "googlesnake" },
    { name: "Moto X3M", dir: "motox3m" },
    { name: "OvO", dir: "ovo" },
    { name: "Pac-Man", dir: "pacman" },
    { name: "Paper.io", dir: "paperio" },
    { name: "Retro Bowl", dir: "retrobowl" },
    { name: "Run 3", dir: "run3" },
    { name: "Slope", dir: "slope" },
    { name: "Slither.io", dir: "slitherio" },
    { name: "Snake", dir: "snake" },
    { name: "Solitaire", dir: "solitaire" },
    { name: "Minecraft", file: "Minecraft.html" }
];

function getAllGames() {
    return [...customGames, ...DEFAULT_GAMES];
}

window.owner = function(password) {
    if (password === 'Owner123') {
        isOwnerMode = true;
        safeSetItem('winyates_owner_mode', true);
        applyOwnerUI();
        console.log("%c👑 OWNER MODE UNLOCKED SUCCESSFULLY!", "color: #f59e0b; font-weight: bold; font-size: 16px;");
        return "Owner mode unlocked! 'Add Game' button is now available in header.";
    } else {
        console.error("Incorrect owner password.");
        return "Incorrect password.";
    }
};

function applyOwnerUI() {
    const badge = document.getElementById("ownerBadge");
    const addBtn = document.getElementById("addGameBtn");
    if (badge) badge.style.display = isOwnerMode ? "flex" : "none";
    if (addBtn) addBtn.style.display = isOwnerMode ? "inline-flex" : "none";
}

function renderGrid(items) {
    const grid = document.getElementById("gameGrid");
    const countEl = document.getElementById("gameCount");
    if (!grid || !countEl) return;
    grid.innerHTML = "";

    countEl.textContent = `Showing ${items.length} ${items.length === 1 ? 'game' : 'games'}`;

    items.forEach((game) => {
        const isFav = userFavorites.includes(game.name);
        const card = document.createElement("div");
        card.className = "card";
        
        let gamePath = game.url || (game.file ? `./${game.file}` : `./games/${game.dir}/`);
        
        card.innerHTML = `
            <span class="fav-star ${isFav ? 'active' : ''}">★</span>
            <div class="card-title">${game.name}</div>
        `;

        const star = card.querySelector('.fav-star');
        star.onclick = (e) => {
            e.stopPropagation();
            toggleFav(game.name);
        };

        card.onclick = () => {
            openGame(game.name, gamePath);
        };

        grid.appendChild(card);
    });
}

function renderShelves() {
    const favSec = document.getElementById("favSection");
    const favGrid = document.getElementById("favGrid");
    const allGames = getAllGames();

    if (userFavorites.length > 0) {
        favSec.style.display = "block";
        favGrid.innerHTML = userFavorites.map(name => {
            const game = allGames.find(g => g.name === name);
            if (!game) return '';
            const path = game.url || (game.file ? `./${game.file}` : `./games/${game.dir}/`);
            return `<div class="shelf-card" onclick="openGame('${game.name.replace(/'/g, "\\'")}', '${path}')"><div class="shelf-card-title">${game.name}</div></div>`;
        }).join('');
    } else {
        favSec.style.display = "none";
    }
}

function filterGames() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const filtered = getAllGames().filter(g => 
        g.name.toLowerCase().includes(query)
    );
    renderGrid(filtered);
}

function toggleFav(gameName) {
    if (userFavorites.includes(gameName)) {
        userFavorites = userFavorites.filter(f => f !== gameName);
    } else {
        userFavorites.push(gameName);
    }
    safeSetItem('winyates_favs', userFavorites);
    filterGames();
    renderShelves();
}

function openAddGameModal() {
    document.getElementById("addGameModal").classList.add("active");
}

function closeDialog(id) {
    document.getElementById(id).classList.remove("active");
}

function handleAddGameSubmit(e) {
    e.preventDefault();
    const title = document.getElementById("newGameTitle").value.trim();
    const url = document.getElementById("newGameUrl").value.trim();

    if (!title || !url) return;

    customGames.push({ name: title, url: url });
    safeSetItem('winyates_custom_games', customGames);

    document.getElementById("newGameTitle").value = "";
    document.getElementById("newGameUrl").value = "";
    closeDialog("addGameModal");

    filterGames();
}

function openGame(title, path) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("gameFrame").src = path;
    document.getElementById("gameModal").classList.add("active");
}

function closeGame() {
    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }
    document.getElementById("gameModal").classList.remove("active");
    document.getElementById("gameFrame").src = "";
}

function toggleFullscreen() {
    const iframe = document.getElementById("gameFrame");
    if (!document.fullscreenElement) {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById("themeBtn");
    if (body.getAttribute("data-theme") === "dark") {
        body.removeAttribute("data-theme");
        btn.textContent = "🌙 Dark";
    } else {
        body.setAttribute("data-theme", "dark");
        btn.textContent = "☀️ Light";
    }
}

window.addEventListener("DOMContentLoaded", () => {
    applyOwnerUI();
    filterGames();
    renderShelves();

    console.log("%c🎮 WINYATES EDITION READY!", "color: #7c3aed; font-weight: 900; font-size: 20px;");
    console.log("%cType owner('Owner123') in this console to unlock Owner mode!", "color: #f59e0b; font-weight: bold; font-size: 14px;");
});
</script>
</body>
</html>
