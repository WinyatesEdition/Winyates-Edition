<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winyates Edition - By Roy</title>

<!-- Official GameDistribution SDK -->
<script type="text/javascript">
    window["GD_OPTIONS"] = {
        "gameId": "d1714a3d72f24852b27b71020d68585a", // Default GD runtime container
        "onEvent": function(event) {
            switch (event.name) {
                case "SDK_GAME_START":
                    console.log("GD SDK: Game Active");
                    break;
                case "SDK_GAME_PAUSE":
                    console.log("GD SDK: Game Paused");
                    break;
                case "SDK_READY":
                    console.log("GD SDK: Ready");
                    break;
            }
        }
    };
    (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = "https://html5.api.gamedistribution.com/main.min.js";
        fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'gamedistribution-jssdk'));
</script>

<style>
    :root {
        --bg: #09090b;
        --card-bg: #141419;
        --card-hover: #1f1f28;
        --text: #f8fafc;
        --text-sub: #94a3b8;
        --border: #27272a;
        --header-bg: rgba(20, 20, 25, 0.95);
        --accent-purple: #8b5cf6;
        --accent-orange: #f59e0b;
        --accent-blue: #3b82f6;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-hover: #f1f5f9;
        --text: #0f172a;
        --text-sub: #64748b;
        --border: #e2e8f0;
        --header-bg: rgba(255, 255, 255, 0.95);
        --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-y: scroll; }

    .announcement-bar {
        background: linear-gradient(90deg, #8b5cf6, #d946ef);
        color: #ffffff;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
    }
    .announcement-text { display: flex; align-items: center; gap: 8px; }
    .announcement-close { background: none; border: none; color: #fff; font-weight: 900; cursor: pointer; font-size: 1rem; }

    header {
        position: sticky; top: 0; z-index: 100;
        background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem;
        display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow);
    }

    .brand-container { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .brand-logo { width: 38px; height: 38px; background: rgba(139, 92, 246, 0.1); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .brand-title { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .owner-badge {
        background: linear-gradient(135deg, #f59e0b, #b45309);
        color: #000000;
        font-weight: 900;
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
        border-radius: 20px;
        letter-spacing: 0.5px;
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    
    .dropdown { position: relative; display: inline-block; }
    .school-btn { background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 30px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .dropdown-content { display: none; position: absolute; right: 0; top: 110%; background-color: var(--card-bg); min-width: 180px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; z-index: 200; box-shadow: var(--shadow); }
    .dropdown-content a { color: var(--text); padding: 10px 14px; text-decoration: none; display: block; font-size: 0.85rem; font-weight: 600; border-bottom: 1px solid var(--border); }
    .dropdown-content a:hover { background-color: var(--card-hover); color: var(--accent-purple); }
    .dropdown:hover .dropdown-content { display: block; }

    .search-container input { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 30px; outline: none; width: 180px; font-size: 0.85rem; }
    .search-container input:focus { border-color: var(--accent-purple); width: 220px; }

    .nav-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 0.9rem; border-radius: 30px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .nav-btn:hover { border-color: var(--accent-purple); }

    .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }
    
    .filter-bar { display: flex; gap: 0.5rem; overflow-x: auto; margin-bottom: 1.2rem; padding-bottom: 0.4rem; }
    .chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .chip:hover, .chip.active { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

    .game-count { margin-bottom: 1rem; color: var(--text-sub); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 95px; position: relative; }
    .card:hover { transform: translateY(-4px); background-color: var(--card-hover); border-color: var(--accent-purple); box-shadow: var(--shadow); }
    .card-cat { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--accent-orange); margin-bottom: 4px; }
    .card-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }

    /* Modal / Viewer */
    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.92); flex-direction: column; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding: 0.6rem 1.2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .modal-controls { display: flex; gap: 0.5rem; }
    .control-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .close-btn { background: #ef4444; color: #fff; border: none; }

    .iframe-wrapper { flex: 1; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--border); }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<div class="announcement-bar" id="announcementBar">
    <div class="announcement-text">⚡ <span><b>Auto-Launcher Ready:</b> GameDistribution SDK & Unity WebGL Engine Hook Active!</span></div>
    <button class="announcement-close" onclick="document.getElementById('announcementBar').style.display='none'">✕</button>
</div>

<header>
    <div class="brand-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="brand-logo">
            <svg viewBox="0 0 200 180" width="24" height="24">
                <path d="M 30,30 Q 170,-10 160,70 Q 150,110 50,100" fill="none" stroke="#8b5cf6" stroke-width="22" stroke-linecap="round"/>
                <text x="62" y="112" font-family="Arial Black, sans-serif" font-weight="900" font-size="120" fill="#f59e0b">W</text>
            </svg>
        </div>
        <div class="brand-title">Winyates Edition</div>
        <div class="owner-badge">👑 Roy Owner</div>
    </div>

    <div class="header-actions">
        <div class="dropdown">
            <button class="school-btn">🏫 School Apps ▾</button>
            <div class="dropdown-content">
                <a href="https://www.edshed.com" target="_blank">🐝 EdShed</a>
                <a href="https://play.ttrockstars.com" target="_blank">🎸 TTRS</a>
                <a href="https://www.myon.co.uk" target="_blank">📚 myON</a>
                <a href="https://student.classdojo.com/#/dojoIslands" target="_blank">🏝️ Dojo Islands</a>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()">
        </div>
        <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
    </div>
</header>

<main class="container">
    <div class="filter-bar">
        <div class="chip active" onclick="setCat('All')">All Games</div>
        <div class="chip" onclick="setCat('Local')">📁 Local Folder</div>
        <div class="chip" onclick="setCat('Shooter')">🎯 Shooters</div>
        <div class="chip" onclick="setCat('Escapes')">🏃 Obby & Escapes</div>
        <div class="chip" onclick="setCat('Classics')">🏎️ Classics & Fun</div>
    </div>

    <div class="game-count" id="gameCount">Loading collection...</div>
    <div id="gameGrid" class="grid"></div>
</main>

<div id="gameModal" class="modal">
    <div class="modal-bar">
        <div id="modalTitle" class="modal-title">Game View</div>
        <div class="modal-controls">
            <button class="control-btn" onclick="popoutWindow()">Popout ↗</button>
            <button class="control-btn" onclick="toggleFullscreen()">Fullscreen ⛶</button>
            <button class="control-btn close-btn" onclick="closeGame()">Close ✕</button>
        </div>
    </div>
    <div class="iframe-wrapper">
        <iframe id="gameFrame" allow="autoplay; fullscreen; pointer-lock; accelerometer; magnetometer; gyroscope; web-share; payment" referrerpolicy="no-referrer"></iframe>
    </div>
</div>

<script>
const GAMES_LIST = [
    // LOCAL FOLDER
    { name: "A Dark Room", cat: "Local", path: "./games/adarkroom/" },
    { name: "Baldi's Basics", cat: "Local", path: "./games/baldisbasics/" },
    { name: "BitLife", cat: "Local", path: "./games/bitlife/" },
    { name: "Cookie Clicker", cat: "Local", path: "./games/cookieclicker/" },
    { name: "Minecraft Classic", cat: "Local", path: "./Minecraft.html" },
    { name: "OvO Platformer", cat: "Local", path: "./games/ovo/" },
    { name: "Run 3", cat: "Local", path: "./games/run3/" },

    // GAMEDISTRIBUTION AUTO-LAUNCH EMBEDS
    { name: "Obby: +1 Keyboard Speed Escape", cat: "Escapes", path: "https://html5.gamedistribution.com/81d4e83974514ecb98d9e9551e63b929/" },
    { name: "Time Shooter 2", cat: "Shooter", path: "https://html5.gamedistribution.com/62a72f2da7cb4b609579a47653546e6a/" },
    { name: "Time Shooter 3 SWAT", cat: "Shooter", path: "https://html5.gamedistribution.com/6493b872f0564380a7adad671d1e0a57/" },
    { name: "ev.io", cat: "Shooter", path: "https://html5.gamedistribution.com/132f756c1dad4e38862ab81c0d7ab026/" },
    { name: "Moto X3M Dead Ahead", cat: "Classics", path: "https://html5.gamedistribution.com/8593f8d7add14ad398d9cece72ee7283/" },
    { name: "Rift Fighter", cat: "Shooter", path: "https://html5.gamedistribution.com/d1714a3d72f24852b27b71020d68585a/" },
    { name: "Funny Shooter 2", cat: "Shooter", path: "https://html5.gamedistribution.com/a1b7ac4025214a5cb0bd01a4f675513a/" },
    { name: "Sniper for Brainrot", cat: "Shooter", path: "https://html5.gamedistribution.com/e41aeb486db5460c972b56afe000e727/" },
    { name: "Vex Try to Fly", cat: "Escapes", path: "https://html5.gamedistribution.com/42bfa359db1e405f8cc84b181c206f7c/" },
    { name: "Vex 9", cat: "Escapes", path: "https://html5.gamedistribution.com/8d034584a63642dcb89fa3d24ed6e1b1/" },
    { name: "Vex 7", cat: "Escapes", path: "https://html5.gamedistribution.com/0c454c9562d249d28ba3a2b50564042c/" },
    { name: "Vex 6", cat: "Escapes", path: "https://html5.gamedistribution.com/4925e12574364121a48c61c35f649c36/" },
    { name: "Squid Shooter", cat: "Shooter", path: "https://html5.gamedistribution.com/c0a72373f81d4096a325f9b0dde0d7b9/" },
    { name: "Steal a Fish", cat: "Classics", path: "https://html5.gamedistribution.com/d9afb8cc970c48c4b7cacef65a5aef61/" },
    { name: "Dusty Cat", cat: "Classics", path: "https://html5.gamedistribution.com/141b948c1f5c4476acc673d84f2ad1c0/" },
    { name: "Chainline", cat: "Classics", path: "https://html5.gamedistribution.com/8e30a011d41d4c52b67eadeabc1b9185/" },
    { name: "Bounce Stack 3D", cat: "Classics", path: "https://html5.gamedistribution.com/54c68d88d899434784867ef30bfbeeee/" },

    // CRAZYGAMES EMBEDS
    { name: "Shell Shockers", cat: "Shooter", path: "https://www.crazygames.com/embed/shellshockers" },
    { name: "Smash Karts", cat: "Shooter", path: "https://www.crazygames.com/embed/smash-karts" },
    { name: "Subway Surfers", cat: "Classics", path: "https://www.crazygames.com/embed/subway-surfers" }
];

let selectedCategory = "All";
let activeGameUrl = "";

function renderGrid(items) {
    const grid = document.getElementById("gameGrid");
    const countEl = document.getElementById("gameCount");
    grid.innerHTML = "";
    countEl.textContent = `Showing ${items.length} games`;

    items.forEach((game) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="card-cat">${game.cat}</div>
            <div class="card-title">${game.name}</div>
        `;
        card.onclick = () => openGame(game.name, game.path);
        grid.appendChild(card);
    });
}

function setCat(cat) {
    selectedCategory = cat;
    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.textContent.includes(cat) || (cat === 'All' && c.textContent.includes('All')));
    });
    filterGames();
}

function filterGames() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const filtered = GAMES_LIST.filter(g => {
        const matchesQ = g.name.toLowerCase().includes(query);
        const matchesCat = selectedCategory === "All" || g.cat === selectedCategory;
        return matchesQ && matchesCat;
    });
    renderGrid(filtered);
}

function openGame(title, path) {
    activeGameUrl = path;
    document.getElementById("modalTitle").textContent = title;
    
    const iframe = document.getElementById("gameFrame");
    iframe.src = path;
    
    // Auto-launch trigger for GameDistribution SDK
    if (window.gamedistribution && typeof window.gamedistribution.showAd === 'function') {
        try {
            window.gamedistribution.showAd();
        } catch(e) {
            console.log("Auto-launching direct frame stream...");
        }
    }
    
    document.getElementById("gameModal").classList.add("active");
}

function closeGame() {
    document.getElementById("gameModal").classList.remove("active");
    document.getElementById("gameFrame").src = "";
    activeGameUrl = "";
}

function popoutWindow() {
    if (activeGameUrl) {
        window.open(activeGameUrl, '_blank');
    }
}

function toggleFullscreen() {
    const iframe = document.getElementById("gameFrame");
    if (!document.fullscreenElement) {
        iframe.requestFullscreen().catch(err => {
            alert("Fullscreen error: " + err.message);
        });
    } else {
        document.exitFullscreen();
    }
}

function toggleTheme() {
    const body = document.body;
    if (body.getAttribute("data-theme") === "light") {
        body.removeAttribute("data-theme");
        document.getElementById("themeBtn").textContent = "🌙 Dark";
    } else {
        body.setAttribute("data-theme", "light");
        document.getElementById("themeBtn").textContent = "☀️ Light";
    }
}

window.addEventListener("DOMContentLoaded", () => {
    filterGames();
});
</script>
</body>
</html>
