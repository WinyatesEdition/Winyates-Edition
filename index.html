<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winyates Edition</title>
<style>
    :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-sub: #64748b;
        --border: #e2e8f0;
        --header-bg: rgba(255, 255, 255, 0.85);
        --accent-orange: #f59e0b;
        --accent-purple: #7c3aed;
        --card-hover: #ffffff;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --shadow-hover: 0 20px 25px -5px rgba(124, 58, 237, 0.15);
        --btn-bg: #f1f5f9;
        --school-blue: #2563eb;
    }

    [data-theme="dark"] {
        --bg: #09090b;
        --card-bg: #141419;
        --text: #f8fafc;
        --text-sub: #94a3b8;
        --border: #27272a;
        --header-bg: rgba(20, 20, 25, 0.85);
        --accent-orange: #fbbf24;
        --accent-purple: #a78bfa;
        --card-hover: #1a1a22;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 20px 25px -5px rgba(167, 139, 250, 0.2);
        --btn-bg: #27272a;
        --school-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: background-color 0.25s, color 0.25s, border-color 0.25s; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-y: scroll; }

    header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--header-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow);
    }

    .brand-container { display: flex; align-items: center; gap: 14px; cursor: pointer; user-select: none; }
    .logo-wrapper { background: rgba(124, 58, 237, 0.05); border: 1px solid var(--border); padding: 4px 8px; border-radius: 12px; display: flex; align-items: center; }
    .logo-img { height: 42px; width: auto; }
    .brand-title { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .search-container input { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 1.2rem; border-radius: 30px; outline: none; width: 220px; font-size: 0.9rem; }
    .search-container input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }

    /* SCHOOL DROPDOWN MENU */
    .dropdown { position: relative; display: inline-block; }
    .school-btn {
        background: linear-gradient(135deg, var(--school-blue), #1d4ed8);
        color: #ffffff;
        border: none;
        padding: 0.55rem 1.1rem;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .school-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 110%;
        background-color: var(--card-bg);
        min-width: 200px;
        box-shadow: var(--shadow-hover);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        z-index: 200;
    }
    .dropdown-content a {
        color: var(--text);
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
    }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover { background-color: var(--btn-bg); color: var(--accent-purple); }
    .dropdown:hover .dropdown-content { display: block; }

    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 1rem; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .theme-toggle:hover { border-color: var(--accent-orange); }

    .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }
    .game-count { margin-bottom: 1.25rem; color: var(--text-sub); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.25rem; }

    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 90px;
        position: relative;
        overflow: hidden;
        transition: all 0.25s ease;
    }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent-purple), var(--accent-orange)); opacity: 0; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent-purple); box-shadow: var(--shadow-hover); }
    .card:hover::before { opacity: 1; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.3; }

    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px); flex-direction: column; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding: 0.6rem 1.2rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .modal-controls { display: flex; gap: 0.5rem; }
    .control-btn { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    .close-btn { background: #ef4444; color: #fff; border: none; }

    .iframe-wrapper { flex: 1; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #000; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<header>
    <div class="brand-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="logo-wrapper">
            <svg class="logo-img" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <path d="M 30,30 Q 170,-10 160,70 Q 150,110 50,100" fill="none" stroke="#7e22ce" stroke-width="22" stroke-linecap="round"/>
                <path d="M 45,90 Q 160,70 140,120 Q 120,150 60,135" fill="none" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
                <path d="M 60,125 Q 150,115 130,150 Q 110,170 70,160" fill="none" stroke="#15803d" stroke-width="14" stroke-linecap="round"/>
                <path d="M 70,150 Q 130,145 115,168" fill="none" stroke="#eab308" stroke-width="10" stroke-linecap="round"/>
                <path d="M 85,165 Q 120,163 105,178" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
                <path d="M 92,175 Q 110,174 100,183" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
                <text x="62" y="112" font-family="Arial Black, sans-serif" font-weight="900" font-size="120" fill="#f59e0b" stroke="#000" stroke-width="3">W</text>
            </svg>
        </div>
        <div class="brand-title">Winyates Edition</div>
    </div>
    <div class="header-actions">
        <!-- SCHOOL APPS DROPDOWN -->
        <div class="dropdown">
            <button class="school-btn">🏫 School Apps ▾</button>
            <div class="dropdown-content">
                <a href="https://www.edshed.com" target="_blank">🐝 Launch EdShed</a>
                <a href="https://play.ttrockstars.com" target="_blank">🎸 Launch TTRS</a>
                <a href="https://www.myon.co.uk" target="_blank">📚 Launch myON</a>
                <a href="https://student.classdojo.com/#/dojoIslands" target="_blank">🏝️ Launch Dojo Islands</a>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()">
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
    </div>
</header>

<main class="container">
    <div class="game-count" id="gameCount">Showing all games</div>
    <div id="gameGrid" class="grid"></div>
</main>

<div id="gameModal" class="modal">
    <div class="modal-bar">
        <div id="modalTitle" class="modal-title">Game View</div>
        <div class="modal-controls">
            <button class="control-btn" onclick="toggleFullscreen()">Fullscreen ⛶</button>
            <button class="control-btn close-btn" onclick="closeGame()">Close ✕</button>
        </div>
    </div>
    <div class="iframe-wrapper">
        <iframe id="gameFrame" allow="autoplay; gamepad; fullscreen; focus-without-user-activation"></iframe>
    </div>
</div>

function renderGrid(items) {
    const grid = document.getElementById("gameGrid");
    const countEl = document.getElementById("gameCount");
    grid.innerHTML = "";

    countEl.textContent = `Showing ${items.length} ${items.length === 1 ? 'game' : 'games'}`;

    items.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";
        const gamePath = game.file ? `./${game.file}` : `./games/${game.dir}/`;
        card.onclick = () => openGame(game.name, gamePath);
        card.innerHTML = `<div class="card-title">${game.name}</div>`;
        grid.appendChild(card);
    });
}

function filterGames() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const filtered = GAMES.filter(g => 
        g.name.toLowerCase().includes(query) || 
        (g.dir && g.dir.toLowerCase().includes(query)) ||
        (g.file && g.file.toLowerCase().includes(query))
    );
    renderGrid(filtered);
}

function openGame(title, path) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("gameFrame").src = path;
    document.getElementById("gameModal").classList.add("active");
}

function closeGame() {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
    document.getElementById("gameModal").classList.remove("active");
    document.getElementById("gameFrame").src = "";
}

function toggleFullscreen() {
    const iframe = document.getElementById("gameFrame");
    if (!document.fullscreenElement) {
        if (iframe.requestFullscreen) {
            iframe.requestFullscreen();
        } else if (iframe.webkitRequestFullscreen) {
            iframe.webkitRequestFullscreen();
        } else if (iframe.msRequestFullscreen) {
            iframe.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById("themeBtn");
    if (body.getAttribute("data-theme") === "dark") {
        body.removeAttribute("data-theme");
        btn.textContent = "🌙 Dark";
    } else {
        body.setAttribute("data-theme", "dark");
        btn.textContent = "☀️ Light";
    }
}

renderGrid(GAMES);
