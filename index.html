<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Winyates Edition</title>
<meta name="description" content="The Winyates Edition - Arcade, Racing, Sports, and Classic Games.">

<!-- Embedded SVG Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50,90 Q40,80 50,70 T50,50 T50,30' stroke='%23ff9900' stroke-width='6' fill='none'/><path d='M30,75 Q70,75 50,60 T30,45 T70,30' stroke='%233388ff' stroke-width='8' fill='none'/><path d='M20,40 Q80,40 50,20' stroke='%238800cc' stroke-width='10' fill='none'/><text x='50' y='42' font-family='Arial Black, sans-serif' font-size='42' fill='%23ffaa00' stroke='%23442200' stroke-width='2' text-anchor='middle'>W</text></svg>">

<style>
:root {
    --bg: #0f1117;
    --card: #161922;
    --card-hover: #1f2330;
    --text: #f0f3f8;
    --muted: #8a94a6;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --header: rgba(15, 17, 23, 0.85);
    --gradient-1: #6366f1;
    --gradient-2: #a855f7;
}

body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(0, 0, 0, 0.08);
    --header: rgba(244, 246, 251, 0.85);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background-color 0.3s, color 0.3s;
    min-height: 100vh;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
}

.logo-svg {
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 2px 8px var(--accent-glow));
}

.title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffb703, #fb8500, #7000ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
}

.search {
    flex: 1;
    max-width: 500px;
    margin-left: auto;
    position: relative;
}

.search input {
    width: 100%;
    padding: 10px 16px 10px 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    transition: all 0.2s;
}

.search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
}

.header-button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.header-button:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-1px);
}

/* NAV */
.nav-container {
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.1);
}

.nav {
    max-width: 1500px;
    margin: auto;
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
}

.nav::-webkit-scrollbar {
    display: none;
}

.nav button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
}

.nav button:hover {
    color: var(--text);
    border-color: var(--accent);
}

.nav button.active {
    background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 12px var(--accent-glow);
}

/* HERO */
.hero {
    max-width: 1500px;
    margin: 0 auto;
    padding: 28px 24px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.hero h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.hero p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
}

.badge {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
}

/* GAMES GRID */
.container {
    max-width: 1500px;
    margin: auto;
    padding: 16px 24px 60px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.games.small {
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
}

.games.large {
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}

/* CARD */
.game {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
}

.game:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.5);
}

.thumbnail {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.15));
    position: relative;
    user-select: none;
}

.game-info {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
}

.game-title {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.game-category {
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
}

.favorite {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    color: white;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    z-index: 2;
}

.favorite:hover {
    transform: scale(1.1);
    background: rgba(0,0,0,0.8);
}

.favorite.active {
    color: #ffb703;
}

/* PLAYER MODAL */
.player {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(10, 11, 15, 0.95);
    backdrop-filter: blur(10px);
    padding: 20px;
    flex-direction: column;
}

.player.open {
    display: flex;
}

.player-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom: 16px;
}

.player-title {
    color: white;
    font-size: 18px;
    font-weight: 700;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 10px;
}

.player-button {
    border: 1px solid var(--border);
    background: #1e222d;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.2s;
}

.player-button:hover {
    background: var(--accent);
}

.game-frame {
    flex: 1;
    width: 100%;
    border: 0;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* SETTINGS MODAL */
.settings {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 600;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.settings.open {
    display: flex;
}

.settings-box {
    width: 420px;
    max-width: 100%;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.settings-box h2 {
    font-size: 20px;
    margin-bottom: 16px;
}

.setting {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.setting:last-child {
    border-bottom: 0;
}

.setting-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 8px;
}

.setting button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    transition: all 0.2s;
    margin-right: 6px;
}

.setting button:hover {
    border-color: var(--accent);
}

/* TOAST */
.toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(100px);
    background: #1e222d;
    color: white;
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 30px;
    z-index: 1000;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    font-size: 14px;
    font-weight: 600;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
}

@media(max-width:768px) {
    .title { display: none; }
    .hero { flex-direction: column; align-items: flex-start; gap: 10px; }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <a href="#" class="brand">
            <!-- Winyates Custom SVG Logo -->
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,90 Q35,80 50,68 T50,48 T50,28" stroke="#ff8c00" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M25,75 Q75,75 50,58 T25,42 T75,25" stroke="#3b82f6" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M15,38 Q85,38 50,18" stroke="#8b5cf6" stroke-width="9" fill="none" stroke-linecap="round"/>
                <text x="50" y="44" font-family="Arial Black, sans-serif" font-size="44" fill="#ffb703" stroke="#3a1c00" stroke-width="2" text-anchor="middle">W</text>
            </svg>
            <div class="title">The Winyates Edition</div>
        </a>

        <div class="search">
            <span class="search-icon">🔍</span>
            <input id="search" type="text" placeholder="Search games... (Press '/' to focus)" autocomplete="off">
        </div>

        <button class="header-button" onclick="openSettings()" title="Settings">⚙</button>
    </div>

    <div class="nav-container">
        <div class="nav">
            <button class="active" onclick="setCategory('All Games',this)">All Games</button>
            <button onclick="setCategory('Popular',this)">Popular</button>
            <button onclick="setCategory('Action',this)">Action</button>
            <button onclick="setCategory('Arcade',this)">Arcade</button>
            <button onclick="setCategory('Racing',this)">Racing</button>
            <button onclick="setCategory('Sports',this)">Sports</button>
            <button onclick="setCategory('2 Player',this)">2 Player</button>
            <button onclick="setCategory('Favorites',this)">★ Favorites</button>
        </div>
    </div>
</header>

<section class="hero">
    <div>
        <h1>Welcome to Winyates Arcade</h1>
        <p>Instant browser playable games—no setup needed.</p>
    </div>
    <div class="badge"><span id="gameCount">0</span> Games Available</div>
</section>

<main class="container">
    <div id="games" class="games"></div>
</main>

<!-- GAME PLAYER MODAL -->
<div id="player" class="player">
    <div class="player-bar">
        <button class="player-button" onclick="closeGame()">← Close Game</button>
        <div id="playerTitle" class="player-title">Game Title</div>
        <button class="player-button" onclick="fullscreenGame()">Fullscreen ⛶</button>
    </div>
    <iframe id="gameFrame" class="game-frame" allow="autoplay; gamepad; fullscreen" allowfullscreen></iframe>
</div>

<!-- SETTINGS MODAL -->
<div id="settings" class="settings" onclick="closeSettings(event)">
    <div class="settings-box" onclick="event.stopPropagation()">
        <h2>Settings</h2>
        
        <div class="setting">
            <div class="setting-title">Appearance</div>
            <button onclick="toggleTheme()">Toggle Dark / Light Mode</button>
        </div>

        <div class="setting">
            <div class="setting-title">Card Grid Size</div>
            <button onclick="setCardSize('small')">Small</button>
            <button onclick="setCardSize('normal')">Normal</button>
            <button onclick="setCardSize('large')">Large</button>
        </div>

        <div class="setting">
            <div class="setting-title">Shortcuts</div>
            <div style="color:var(--muted); font-size:13px; line-height:1.6;">
                <b>/</b> = Search<br>
                <b>ESC</b> = Exit Game or Settings
            </div>
        </div>

        <button onclick="closeSettings()" style="width:100%; margin-top:16px; padding:10px; border:0; border-radius:10px; background:var(--accent); color:white; font-weight:bold; cursor:pointer;">Close</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================
   WORKING GAME DATABASE 
   (Uses Reliable HTML5 Web Embeds)
========================= */
const games = [
    // POPULAR & ARCADE
    ["Slope", "Popular", "https://kripdev.github.io/slope/", "▲"],
    ["Geometry Dash", "Popular", "https://scratch.mit.edu/projects/105500895/embed", "◆"],
    ["2048", "Arcade", "https://play2048.co/", "🔢"],
    ["Flappy Bird", "Arcade", "https://flappybird.io/", "🐦"],
    ["Pac-Man", "Arcade", "https://freepacman.org/", "🟡"],
    ["Snake", "Arcade", "https://playsnake.org/", "🐍"],
    ["Tetris", "Arcade", "https://chvin.github.io/react-tetris/", "🧱"],
    ["Space Invaders", "Arcade", "https://freeinvaders.org/", "👾"],

    // SPORTS & 2 PLAYER
    ["Retro Bowl", "Sports", "https://game316013.konggames.com/gamez/0031/6013/live/index.html", "🏈"],
    ["Tic Tac Toe (2P)", "2 Player", "https://playtictactoe.org/", "❌"],
    ["Chess", "2 Player", "https://www.chess.com/play/computer", "♟"],

    // ACTION & RACING
    ["Paper.io 2", "Action", "https://paper-io.com/", "📜"],
    ["Hextris", "Action", "https://hextris.io/", "⬡"],
    ["Vex 3", "Action", "https://vex3.org/", "⚡"]
];

let category = "All Games";
let favorites = JSON.parse(localStorage.getItem("winyates-favs") || "[]");

function displayGames() {
    const box = document.getElementById("games");
    const search = document.getElementById("search").value.toLowerCase();

    let filtered = games.filter(game => {
        const title = game[0].toLowerCase();
        const cat = game[1];
        const url = game[2];

        const matchesSearch = title.includes(search);
        let matchesCategory = true;

        if (category === "Favorites") {
            matchesCategory = favorites.includes(url);
        } else if (category === "Popular") {
            matchesCategory = cat === "Popular";
        } else if (category !== "All Games") {
            matchesCategory = cat === category;
        }

        return matchesSearch && matchesCategory;
    });

    box.innerHTML = "";

    if (filtered.length === 0) {
        box.innerHTML = `
            <div class="empty">
                <h3>No games found</h3>
                <p>Try searching for another title or clear filters.</p>
            </div>`;
        document.getElementById("gameCount").textContent = 0;
        return;
    }

    filtered.forEach(game => {
        const [title, cat, url, icon] = game;
        const isFav = favorites.includes(url);

        const card = document.createElement("div");
        card.className = "game";
        card.onclick = () => playGame(title, url);

        card.innerHTML = `
            <button class="favorite ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${url}')">
                ${isFav ? "★" : "☆"}
            </button>
            <div class="thumbnail">${icon}</div>
            <div class="game-info">
                <div class="game-title">${title}</div>
                <div class="game-category">${cat}</div>
            </div>
        `;
        box.appendChild(card);
    });

    document.getElementById("gameCount").textContent = filtered.length;
}

/* =========================
   GAME CONTROLLER
========================= */
function playGame(title, url) {
    document.getElementById("playerTitle").textContent = title;
    document.getElementById("gameFrame").src = url;
    document.getElementById("player").classList.add("open");
}

function closeGame() {
    document.getElementById("player").classList.remove("open");
    document.getElementById("gameFrame").src = "about:blank";
}

function fullscreenGame() {
    const frame = document.getElementById("gameFrame");
    if (frame.requestFullscreen) frame.requestFullscreen();
    else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
}

/* =========================
   SETTINGS & UTILS
========================= */
function setCategory(cat, button) {
    category = cat;
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    displayGames();
}

function toggleFavorite(url) {
    if (favorites.includes(url)) {
        favorites = favorites.filter(x => x !== url);
        showToast("Removed from favorites");
    } else {
        favorites.push(url);
        showToast("Added to favorites");
    }
    localStorage.setItem("winyates-favs", JSON.stringify(favorites));
    displayGames();
}

function openSettings() {
    document.getElementById("settings").classList.add("open");
}

function closeSettings(event) {
    if (!event || event.target === document.getElementById("settings")) {
        document.getElementById("settings").classList.remove("open");
    }
}

function toggleTheme() {
    document.body.classList.toggle("light");
    localStorage.setItem("winyates-theme", document.body.classList.contains("light") ? "light" : "dark");
}

function setCardSize(size) {
    const box = document.getElementById("games");
    box.classList.remove("small", "large");
    if (size !== 'normal') box.classList.add(size);
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
}

// Global Event Listeners
document.getElementById("search").addEventListener("input", displayGames);

document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        document.getElementById("search").focus();
    }
    if (e.key === "Escape") {
        closeGame();
        document.getElementById("settings").classList.remove("open");
    }
});

// Initialization
if (localStorage.getItem("winyates-theme") === "light") {
    document.body.classList.add("light");
}
displayGames();
</script>
</body>
</html>
