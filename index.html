<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winyates Edition</title>
<style>
    :root {
        --bg: #0b0c10;
        --card-bg: #1f2833;
        --card-hover: #2c3540;
        --accent: #66fcf1;
        --accent-orange: #ff9f43;
        --text: #ffffff;
        --text-sub: #c5c6c7;
        --border: #45a29e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.2s ease; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
        position: sticky; top: 0; z-index: 100;
        background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
        border-bottom: 2px solid var(--border); padding: 0.8rem 1.5rem;
        display: flex; justify-content: space-between; align-items: center;
    }

    .brand { font-size: 1.4rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; }

    .search-bar input {
        background: var(--card-bg); border: 1px solid var(--border);
        color: #fff; padding: 0.5rem 1rem; border-radius: 20px; outline: none; width: 220px;
    }
    .search-bar input:focus { width: 280px; box-shadow: 0 0 10px var(--accent); }

    .category-bar {
        display: flex; gap: 0.5rem; padding: 1rem 1.5rem; overflow-x: auto;
        max-width: 1400px; margin: 0 auto; width: 100%;
    }
    .chip {
        background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub);
        padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .chip:hover, .chip.active { background: var(--border); color: #000; box-shadow: 0 0 10px var(--accent); }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem 2rem 1.5rem; flex: 1; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

    .card {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
        padding: 1.2rem; cursor: pointer; text-align: center; display: flex; flex-direction: column;
        justify-content: center; min-height: 100px; position: relative;
    }
    .card:hover { transform: translateY(-4px); background: var(--card-hover); border-color: var(--accent); box-shadow: 0 5px 15px rgba(102, 252, 241, 0.2); }
    .card-cat { font-size: 0.65rem; color: var(--accent-orange); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }

    /* Player Modal */
    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); flex-direction: column; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .btn { background: var(--border); color: #000; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 800; cursor: pointer; }
    .btn-close { background: #ff4757; color: #fff; }

    .iframe-box { flex: 1; width: 100%; height: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<header>
    <div class="brand">🎮 WINYATES UNBLOCKED HUB</div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search working games..." oninput="filter()">
    </div>
</header>

<div class="category-bar">
    <div class="chip active" onclick="setCat('All')">All Games</div>
    <div class="chip" onclick="setCat('Shooter')">🎯 Shooters</div>
    <div class="chip" onclick="setCat('Escapes')">🏃 Obby & Escapes</div>
    <div class="chip" onclick="setCat('Classics')">🕹️ Classics & Driving</div>
</div>

<main class="container">
    <div id="gameGrid" class="grid"></div>
</main>

<div id="playerModal" class="modal">
    <div class="modal-head">
        <h3 id="gameTitle">Game</h3>
        <div>
            <button class="btn" onclick="fullscreen()">Fullscreen ⛶</button>
            <button class="btn btn-close" onclick="closeGame()">Close ✕</button>
        </div>
    </div>
    <div class="iframe-box">
        <iframe id="gameIframe" allow="autoplay; fullscreen; pointer-lock;" referrerpolicy="no-referrer"></iframe>
    </div>
</div>

<script>
// Verified list of games with NO Yandex origin-lock errors
const WORKING_GAMES = [
    // SHOOTERS & BANK ROBBERY DIRECT WORKING ENDPOINTS
    { name: "Bank Robbery 2 (Verified Mirror)", cat: "Shooter", url: "https://kripdev.github.io/bank-robbery-2/" },
    { name: "Time Shooter 2", cat: "Shooter", url: "https://html5.gamedistribution.com/e2815bc184024b07a511ec5a452bf9b4/" },
    { name: "Time Shooter 3 SWAT", cat: "Shooter", url: "https://html5.gamedistribution.com/6c42a222854045f9b4dd6bfa2f741c88/" },
    { name: "Funny Shooter 2", cat: "Shooter", url: "https://html5.gamedistribution.com/7b2e3ffb0c514d7a96ef8c1fa877c427/" },
    { name: "Shell Shockers", cat: "Shooter", url: "https://shellshock.io" },
    { name: "Smash Karts", cat: "Shooter", url: "https://smashkarts.io" },
    { name: "Rooftop Snipers", cat: "Shooter", url: "https://html5.gamedistribution.com/262294bfd0a54a7c8d9101b7a2d812ed/" },
    { name: "Getaway Shootout", cat: "Shooter", url: "https://html5.gamedistribution.com/4b7bb577a45e4125b0351db8fdf8f49b/" },

    // OBBY & KEYBOARD ESCAPE WORKING MIRRORS
    { name: "Obby: Web Swing Escape", cat: "Escapes", url: "https://html5.gamedistribution.com/95b211f62b214df7a1926ec037c8ee17/" },
    { name: "Stickman Hook", cat: "Escapes", url: "https://html5.gamedistribution.com/62c9bf1f9dc845348888dd833bf69b59/" },
    { name: "Vex 7", cat: "Escapes", url: "https://html5.gamedistribution.com/7a8286a454d64177a6411dddd190ca15/" },
    { name: "Vex 6", cat: "Escapes", url: "https://html5.gamedistribution.com/71239c0f99ae4d62bd9353ef24dae191/" },
    { name: "OvO Platformer", cat: "Escapes", url: "https://purely-educational.github.io/ovo/" },
    { name: "Slope Unblocked", cat: "Escapes", url: "https://kripdev.github.io/slope/" },

    // CLASSICS & DRIVING
    { name: "Retro Bowl", cat: "Classics", url: "https://game316009.konggames.com/gamez/0031/6009/live/index.html" },
    { name: "Subway Surfers", cat: "Classics", url: "https://html5.gamedistribution.com/f3e8f85d26a24446a81bf6dfd8471e8c/" },
    { name: "Drive Mad", cat: "Classics", url: "https://html5.gamedistribution.com/4f7eb8b1e4a34b229983dd80126a11e8/" },
    { name: "Moto X3M", cat: "Classics", url: "https://html5.gamedistribution.com/5b80d0d624a949e2898b16a2efb3bf21/" },
    { name: "Drift Boss", cat: "Classics", url: "https://html5.gamedistribution.com/643b0c48ef234dfa8b0a53b5faed2fb1/" },
    { name: "Tiny Fishing", cat: "Classics", url: "https://html5.gamedistribution.com/8bb02999d30d41e78eb285edfbbf8e52/" }
];

let selectedCategory = "All";

function render(games) {
    const grid = document.getElementById("gameGrid");
    grid.innerHTML = "";
    games.forEach(g => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<div class="card-cat">${g.cat}</div><div class="card-title">${g.name}</div>`;
        div.onclick = () => openGame(g.name, g.url);
        grid.appendChild(div);
    });
}

function setCat(cat) {
    selectedCategory = cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent.includes(cat) || (cat === 'All' && c.textContent.includes('All'))));
    filter();
}

function filter() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const filtered = WORKING_GAMES.filter(g => {
        const matchesQ = g.name.toLowerCase().includes(q);
        const matchesCat = selectedCategory === "All" || g.cat === selectedCategory;
        return matchesQ && matchesCat;
    });
    render(filtered);
}

function openGame(title, url) {
    document.getElementById("gameTitle").textContent = title;
    document.getElementById("gameIframe").src = url;
    document.getElementById("playerModal").classList.add("active");
}

function closeGame() {
    document.getElementById("playerModal").classList.remove("active");
    document.getElementById("gameIframe").src = "";
}

function fullscreen() {
    const frame = document.getElementById("gameIframe");
    if (!document.fullscreenElement) frame.requestFullscreen();
    else document.exitFullscreen();
}

// Initial render
render(WORKING_GAMES);
</script>
</body>
</html>
