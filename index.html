<style>
    :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-sub: #64748b;
        --border: #e2e8f0;
        --header-bg: rgba(255, 255, 255, 0.88);
        --accent-orange: #f59e0b;
        --accent-purple: #7c3aed;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --shadow-hover: 0 20px 25px -5px rgba(124, 58, 237, 0.2);
        --btn-bg: #f1f5f9;
        --school-blue: #2563eb;
        --owner-gold: #d97706;
        --danger-red: #ef4444;
    }

    [data-theme="dark"] {
        --bg: #09090b;
        --card-bg: #141419;
        --text: #f8fafc;
        --text-sub: #94a3b8;
        --border: #27272a;
        --header-bg: rgba(20, 20, 25, 0.88);
        --accent-orange: #fbbf24;
        --accent-purple: #a78bfa;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 20px 25px -5px rgba(167, 139, 250, 0.25);
        --btn-bg: #27272a;
        --school-blue: #3b82f6;
        --owner-gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-y: scroll; }

    /* HEADER */
    header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--header-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow);
    }

    .brand-container { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .logo-wrapper { background: rgba(124, 58, 237, 0.05); border: 1px solid var(--border); padding: 4px 8px; border-radius: 12px; display: flex; align-items: center; }
    .logo-wrapper:hover { transform: rotate(-3deg) scale(1.05); }
    .logo-img { height: 38px; width: auto; }
    .brand-title { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    
    .search-container input { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 30px; outline: none; width: 180px; font-size: 0.85rem; }
    .search-container input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); width: 220px; }

    .nav-btn {
        background: var(--btn-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 0.5rem 0.9rem;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .nav-btn:hover { transform: translateY(-2px); border-color: var(--accent-purple); }

    .dropdown { position: relative; display: inline-block; }
    .school-btn {
        background: linear-gradient(135deg, var(--school-blue), #1d4ed8);
        color: #ffffff;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .school-btn:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.1); }
    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 110%;
        background-color: var(--card-bg);
        min-width: 190px;
        box-shadow: var(--shadow-hover);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        z-index: 200;
    }
    .dropdown-content a {
        color: var(--text);
        padding: 10px 14px;
        text-decoration: none;
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
    }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover { background-color: var(--btn-bg); color: var(--accent-purple); padding-left: 18px; }
    .dropdown:hover .dropdown-content { display: block; }

    .owner-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: rgba(217, 119, 6, 0.15);
        border: 1px solid var(--owner-gold);
        border-radius: 30px;
        color: var(--owner-gold);
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
    }

    /* LAYOUT & SHELVES */
    .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }
    
    .shelf-section { margin-bottom: 1.5rem; display: none; }
    .shelf-title { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sub); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 6px; }
    .horizontal-scroll { display: flex; gap: 0.8rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: thin; }
    .shelf-card { min-width: 150px; background: var(--card-bg); border: 1px solid var(--border); padding: 0.8rem; border-radius: 12px; cursor: pointer; text-align: center; flex-shrink: 0; }
    .shelf-card:hover { border-color: var(--accent-purple); transform: translateY(-3px); }
    .shelf-card-title { font-size: 0.8rem; font-weight: 700; }

    /* MAIN GAME GRID */
    .game-count { margin-bottom: 1rem; color: var(--text-sub); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.1rem; }

    /* GAME CARD */
    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.1rem 0.9rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 95px;
        position: relative;
        overflow: hidden;
    }
    .card::before { 
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; 
        background: linear-gradient(90deg, var(--accent-purple), var(--accent-orange)); 
        opacity: 0; transition: opacity 0.25s ease; 
    }
    .card:hover { transform: translateY(-5px) scale(1.02); border-color: var(--accent-purple); box-shadow: var(--shadow-hover); }
    .card:hover::before { opacity: 1; }
    
    .card.unplayable { opacity: 0.6; filter: grayscale(0.8); cursor: not-allowed; border-color: var(--border) !important; }
    .card.unplayable:hover { transform: none; box-shadow: none; }

    .card-title { font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .fav-star { position: absolute; top: 8px; right: 8px; font-size: 0.85rem; color: var(--border); cursor: pointer; transition: transform 0.2s; z-index: 5; }
    .fav-star.active { color: var(--accent-orange); }
    .fav-star:hover { transform: scale(1.3); }

    .owner-controls { position: absolute; bottom: 6px; right: 6px; z-index: 10; }
    .owner-btn { background: var(--btn-bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .owner-btn:hover { background: var(--accent-purple); color: #fff; }

    .status-badge { position: absolute; top: 8px; left: 8px; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; font-weight: 800; text-transform: uppercase; }
    .badge-locked { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); border: 1px solid var(--danger-red); }

    /* MODAL SYSTEM */
    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px); flex-direction: column; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding: 0.6rem 1.2rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .modal-controls { display: flex; gap: 0.5rem; }
    .control-btn { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .control-btn:hover { transform: translateY(-2px); }
    .close-btn { background: #ef4444; color: #fff; border: none; }

    .iframe-wrapper { flex: 1; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #000; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }

    /* DIALOG POPUPS & ANNOUNCEMENT MODAL */
    .dialog-overlay { display: none; position: fixed; inset: 0; z-index: 1100; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
    .dialog-overlay.active { display: flex; }
    .dialog-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 1.5rem; box-shadow: var(--shadow-hover); position: relative; }
    .dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .dialog-title { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .dialog-close { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

    .announcement-box { background: rgba(124, 58, 237, 0.08); border-left: 4px solid var(--accent-purple); padding: 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.95rem; line-height: 1.5; color: var(--text); }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-sub); text-transform: uppercase; }
    .form-control { width: 100%; background: var(--btn-bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .form-control:focus { border-color: var(--accent-purple); }
    .btn-primary { width: 100%; background: linear-gradient(135deg, var(--accent-purple), #6d28d9); color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; margin-top: 0.5rem; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

}

async function loadGlobalData() {
    const localCustoms = safeGetStorage('winyates_custom_games', []);
    allGames = [...DEFAULT_GAMES, ...localCustoms];

    if (supabaseClient) {
        try {
            // Load custom games
            const { data: dbGames } = await supabaseClient.from('games').select('*');
            if (dbGames && dbGames.length > 0) {
                const gameMap = new Map();
                allGames.forEach(g => gameMap.set(g.name, g));
                dbGames.forEach(g => gameMap.set(g.name, { name: g.name, path: g.path, is_playable: g.is_playable ?? true }));
                allGames = Array.from(gameMap.values());
            }

            // Load announcement
            const { data: annData } = await supabaseClient.from('announcements').select('*').order('created_at', { ascending: false }).limit(1);
            if (annData && annData.length > 0) {
                currentAnnouncement = annData[0].message;
            }
        } catch (e) {
            console.warn("Supabase fetch failed, using local storage:", e);
        }
    }

    renderGrid(allGames);
    renderShelves();
    showAnnouncement();
}

async function saveGameGlobal(name, path) {
    const newGame = { name, path, is_playable: true };
    allGames.push(newGame);

    const localCustoms = safeGetStorage('winyates_custom_games', []);
    localCustoms.push(newGame);
    safeSetStorage('winyates_custom_games', localCustoms);

    if (supabaseClient) {
        try {
            await supabaseClient.from('games').upsert(newGame, { onConflict: 'name' });
        } catch (e) {
            console.warn("Supabase game add failed:", e);
        }
    }
    renderGrid(allGames);
}

async function toggleGamePlayable(gameName) {
    const game = allGames.find(g => g.name === gameName);
    if (!game) return;

    game.is_playable = !(game.is_playable ?? true);

    const localCustoms = safeGetStorage('winyates_custom_games', []);
    const locGame = localCustoms.find(g => g.name === gameName);
    if (locGame) locGame.is_playable = game.is_playable;
    safeSetStorage('winyates_custom_games', localCustoms);

    if (supabaseClient) {
        try {
            await supabaseClient.from('games').upsert({ name: game.name, path: game.path, is_playable: game.is_playable }, { onConflict: 'name' });
        } catch (e) {
            console.warn("Supabase playable toggle failed:", e);
        }
    }
    renderGrid(allGames);
    renderShelves();
}

async function saveAnnouncementGlobal(message) {
    currentAnnouncement = message;
    safeSetStorage('winyates_announcement', message);

    if (supabaseClient) {
        try {
            await supabaseClient.from('announcements').insert([{ message }]);
        } catch (e) {
            console.warn("Supabase announcement broadcast failed:", e);
        }
    }
    showAnnouncement();
}

// ==========================================
// 5. ANNOUNCEMENT SYSTEM
// ==========================================
function showAnnouncement() {
    const annBox = document.getElementById("announcementText");
    if (annBox) {
        annBox.textContent = currentAnnouncement;
        document.getElementById("announcementModal").classList.add("active");
    }
}

function openEditAnnouncementModal() {
    document.getElementById("newAnnouncementInput").value = currentAnnouncement;
    document.getElementById("editAnnouncementModal").classList.add("active");
}

function handleAnnouncementSubmit(e) {
    e.preventDefault();
    const msg = document.getElementById("newAnnouncementInput").value.trim();
    if (msg) {
        saveAnnouncementGlobal(msg);
        closeDialog("editAnnouncementModal");
        alert("Announcement broadcasted successfully!");
    }
}

// ==========================================
// 6. UI RENDER ENGINE
// ==========================================
function renderGrid(items) {
    const grid = document.getElementById("gameGrid");
    const countEl = document.getElementById("gameCount");
    if (!grid || !countEl) return;
    grid.innerHTML = "";

    countEl.textContent = `Showing ${items.length} ${items.length === 1 ? 'game' : 'games'}`;

    items.forEach((game) => {
        const isFav = userFavorites.includes(game.name);
        const isPlayable = game.is_playable ?? true;
        const card = document.createElement("div");
        card.className = `card ${!isPlayable ? 'unplayable' : ''}`;
        
        const escapedName = game.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        
        let statusBadge = !isPlayable ? `<span class="status-badge badge-locked">🔒 Locked</span>` : '';
        let ownerControls = isOwner ? `
            <div class="owner-controls">
                <button class="owner-btn" onclick="handleTogglePlayable(event, '${escapedName}')">
                    ${isPlayable ? 'Make Unplayable' : 'Make Playable'}
                </button>
            </div>
        ` : '';

        card.innerHTML = `
            ${statusBadge}
            <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${escapedName}')">★</span>
            <div class="card-title">${game.name}</div>
            ${ownerControls}
        `;

        card.onclick = (e) => {
            if (e.target.classList.contains('fav-star') || e.target.classList.contains('owner-btn')) return;
            if (!isPlayable && !isOwner) {
                alert("This game has been temporarily disabled by the Owner.");
                return;
            }
            openGame(game.name, game.path);
        };
        grid.appendChild(card);
    });
}

function renderShelves() {
    const recentSec = document.getElementById("recentSection");
    const recentGrid = document.getElementById("recentGrid");
    if (userRecents.length > 0) {
        recentSec.style.display = "block";
        recentGrid.innerHTML = userRecents.map(name => {
            const game = allGames.find(g => g.name === name);
            if (!game) return '';
            const escapedName = game.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `<div class="shelf-card" onclick="openGame('${escapedName}', '${game.path}')"><div class="shelf-card-title">${game.name}</div></div>`;
        }).join('');
    } else {
        recentSec.style.display = "none";
    }

    const favSec = document.getElementById("favSection");
    const favGrid = document.getElementById("favGrid");
    if (userFavorites.length > 0) {
        favSec.style.display = "block";
        favGrid.innerHTML = userFavorites.map(name => {
            const game = allGames.find(g => g.name === name);
            if (!game) return '';
            const escapedName = game.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `<div class="shelf-card" onclick="openGame('${escapedName}', '${game.path}')"><div class="shelf-card-title">${game.name}</div></div>`;
        }).join('');
    } else {
        favSec.style.display = "none";
    }
}

function filterGames() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const filtered = allGames.filter(g => g.name.toLowerCase().includes(query));
    renderGrid(filtered);
}

function toggleFav(e, gameName) {
    e.stopPropagation();
    if (userFavorites.includes(gameName)) {
        userFavorites = userFavorites.filter(f => f !== gameName);
    } else {
        userFavorites.push(gameName);
    }
    safeSetStorage('winyates_favs', userFavorites);
    renderGrid(allGames);
    renderShelves();
}

function addRecent(gameName) {
    userRecents = [gameName, ...userRecents.filter(r => r !== gameName)].slice(0, 8);
    safeSetStorage('winyates_recents', userRecents);
    renderShelves();
}

function handleTogglePlayable(e, gameName) {
    e.stopPropagation();
    toggleGamePlayable(gameName);
}

// ==========================================
// 7. MODALS & GAME LAUNCHER
// ==========================================
function openAddGameModal() {
    document.getElementById("addGameModal").classList.add("active");
}

function closeDialog(id) {
    document.getElementById(id).classList.remove("active");
}

function handleAddGameSubmit(e) {
    e.preventDefault();
    const title = document.getElementById("newGameTitle").value.trim();
    let path = document.getElementById("newGamePath").value.trim();

    if (!title || !path) return;

    if (!path.startsWith('http://') && !path.startsWith('https://') && !path.startsWith('./')) {
        path = `./games/${path}/`;
    }

    saveGameGlobal(title, path);

    document.getElementById("newGameTitle").value = "";
    document.getElementById("newGamePath").value = "";
    closeDialog("addGameModal");
    alert(`Game "${title}" added globally!`);
}

function openGame(title, path) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("gameFrame").src = path;
    document.getElementById("gameModal").classList.add("active");
    addRecent(title);
}

function closeGame() {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
    document.getElementById("gameModal").classList.remove("active");
    document.getElementById("gameFrame").src = "";
}

function toggleFullscreen() {
    const iframe = document.getElementById("gameFrame");
    if (!document.fullscreenElement) {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById("themeBtn");
    if (body.getAttribute("data-theme") === "dark") {
        body.removeAttribute("data-theme");
        btn.textContent = "🌙 Dark";
    } else {
        body.setAttribute("data-theme", "dark");
        btn.textContent = "☀️ Light";
    }
}

// Initialize application
window.addEventListener("DOMContentLoaded", () => {
    loadGlobalData();
});
</script>
